{% extends "base.html" %}
{% block title %}Войти — Решись Авиа{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card"><div class="auth-icon">↗</div><div class="section-kicker">ЛИЧНЫЙ КАБИНЕТ</div><h1>С возвращением</h1><p class="auth-lead">Войдите, чтобы сохранять историю прогнозов.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="email">Электронная почта</label><input id="email" type="email" name="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary btn-block" type="submit">Войти <span class="button-arrow">↗</span></button></form><p class="auth-switch">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p></div></div></section>
{% endblock %}
