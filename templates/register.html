{% extends "base.html" %}
{% block title %}Регистрация — Решись Авиа{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card"><div class="auth-icon">✦</div><div class="section-kicker">НОВЫЙ АККАУНТ</div><h1>Присоединяйтесь</h1><p class="auth-lead">Создайте аккаунт для сохранения истории расчётов.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="name">Ваше имя</label><input id="name" type="text" name="name" autocomplete="name" minlength="2" maxlength="60" placeholder="Как к вам обращаться" required></div><div class="field"><label for="email">Электронная почта</label><input id="email" type="email" name="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Не менее 8 символов" required></div><div class="field"><label for="password_again">Повторите пароль</label><input id="password_again" type="password" name="password_again" autocomplete="new-password" minlength="8" maxlength="128" required></div><button class="btn btn-primary btn-block" type="submit">Создать аккаунт <span class="button-arrow">↗</span></button></form><p class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p></div></div></section>
{% endblock %}
